name: Build iesu VST3
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target iesu_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: iesu-vst3
          path: build/iesu_artefacts/Release/VST3/
